<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="printGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="14" fill="#060913" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="300" cy="190" r="160" fill="url(#printGlow)" />

  <!-- 3D Printer Frame Gantry Structure -->
  <g transform="translate(140, 40)">
    <!-- Base Plate -->
    <rect x="20" y="240" width="280" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Heated Print Bed -->
    <rect x="50" y="210" width="220" height="18" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="160" y="222" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">CAMA TÉRMICA DE IMPRESIÓN</text>
    <line x1="60" y1="210" x2="260" y2="210" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Vertical Aluminum Profiles (Z-Axis) -->
    <rect x="40" y="30" width="18" height="210" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="262" y="30" width="18" height="210" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Top Beam -->
    <rect x="30" y="20" width="260" height="18" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

    <!-- Horizontal Gantry (X-Axis) -->
    <rect x="40" y="115" width="240" height="14" rx="2" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <!-- Lead Screw Z Rods -->
    <line x1="68" y1="38" x2="68" y2="240" stroke="#64748b" stroke-width="3" stroke-dasharray="1 3" />
    <line x1="252" y1="38" x2="252" y2="240" stroke="#64748b" stroke-width="3" stroke-dasharray="1 3" />

    <!-- Print Head / Extruder Assembly -->
    <g transform="translate(135, 100)">
      <!-- Stepper Motor -->
      <rect x="0" y="0" width="50" height="38" rx="4" fill="#090e1a" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="25" cy="18" r="8" fill="#1e293b" />
      <text x="25" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">NEMA 17</text>
      <!-- Hotend & Heatsink -->
      <rect x="15" y="38" width="20" height="22" rx="2" fill="#ef4444" fill-opacity="0.8" />
      <!-- Nozzle -->
      <polygon points="20,60 30,60 25,72" fill="#fbbf24" />
      <circle cx="25" cy="74" r="1.5" fill="#f59e0b" filter="drop-shadow(0 0 4px #f59e0b)" />
    </g>

    <!-- 3D Printed Object on Bed (Hexagonal Medical Prosthetic Part) -->
    <g transform="translate(138, 172)">
      <polygon points="22,0 44,12 44,36 22,48 0,36 0,12" stroke="#38bdf8" stroke-width="2" fill="#06b6d4" fill-opacity="0.3" />
      <line x1="22" y1="0" x2="22" y2="48" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="0" y1="12" x2="44" y2="36" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="44" y1="12" x2="0" y2="36" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
    </g>
  </g>

  <!-- Left Side Badges: Applications -->
  <g transform="translate(40, 80)">
    <rect width="95" height="42" rx="8" fill="#090e1a" stroke="#1e293b" />
    <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">PRÓTESIS</text>
    <text x="10" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Medicina &amp; Salud</text>
  </g>

  <g transform="translate(40, 140)">
    <rect width="95" height="42" rx="8" fill="#090e1a" stroke="#1e293b" />
    <text x="10" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">INDUSTRIAL</text>
    <text x="10" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Piezas de Precisión</text>
  </g>

  <g transform="translate(40, 200)">
    <rect width="95" height="42" rx="8" fill="#090e1a" stroke="#1e293b" />
    <text x="10" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">ARQUITECTURA</text>
    <text x="10" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Maquetas y Moldes</text>
  </g>

  <!-- Right Side: Technical Specs & Microcontroller -->
  <g transform="translate(450, 90)">
    <rect width="120" height="150" rx="10" fill="#090e1a" stroke="#1e293b" />
    <text x="12" y="22" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">ESPECIFICACIONES</text>
    
    <text x="12" y="44" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Controlador:</text>
    <text x="12" y="56" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8">Microcontrolador 32b</text>

    <text x="12" y="76" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Coordenadas:</text>
    <text x="12" y="88" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="8">Cinemática XYZ</text>

    <text x="12" y="108" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Extrusión:</text>
    <text x="12" y="120" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="8">Resistencia Térmica</text>

    <text x="12" y="138" fill="#10b981" font-family="'Inter', sans-serif" font-size="7.5">Modelado CAD 3D</text>
  </g>

  <!-- Bottom Title Strip -->
  <g transform="translate(170, 325)">
    <rect width="260" height="30" rx="15" fill="#090e1a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <text x="130" y="19" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">PROTOTIPADO RÁPIDO Y FABRICACIÓN DIGITAL</text>
  </g>
</svg>
