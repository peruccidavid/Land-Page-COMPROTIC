<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="dirGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="380" rx="14" fill="#060913" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="300" cy="190" r="160" fill="url(#dirGlow)" />

  <!-- Kiosk / All-In-One Touch Display Mockup -->
  <g transform="translate(100, 30)">
    <!-- Monitor Outer Bezel -->
    <rect x="0" y="0" width="400" height="250" rx="16" fill="#090e1a" stroke="#334155" stroke-width="3" />
    <!-- Screen Glass -->
    <rect x="10" y="10" width="380" height="230" rx="10" fill="#030712" />

    <!-- Kiosk App Header -->
    <rect x="18" y="18" width="364" height="30" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="34" cy="33" r="6" fill="#3b82f6" />
    <text x="48" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">DIRECTORIO UNEFA • NÚCLEO CHUAO</text>
    
    <!-- Floor Selector Tabs -->
    <rect x="230" y="23" width="32" height="20" rx="4" fill="#1e293b" />
    <text x="246" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">PB</text>

    <rect x="268" y="23" width="32" height="20" rx="4" fill="#2563eb" />
    <text x="284" y="36" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">P1</text>

    <rect x="306" y="23" width="32" height="20" rx="4" fill="#1e293b" />
    <text x="322" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">P2</text>

    <rect x="344" y="23" width="32" height="20" rx="4" fill="#1e293b" />
    <text x="360" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">P3</text>

    <!-- Floor Plan Map Architecture (Isometric/2D Architectural Blueprint) -->
    <g transform="translate(20, 60)">
      <rect width="250" height="145" rx="6" fill="#08101e" stroke="#1e3a5f" stroke-width="1.2" />
      
      <!-- Rooms / Department Layout -->
      <!-- Decanato / Rectorado -->
      <rect x="10" y="10" width="70" height="50" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="35" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" text-anchor="middle">DECANATO</text>

      <!-- DACE (Selected active department) -->
      <rect x="85" y="10" width="80" height="50" rx="3" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
      <text x="125" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">DACE</text>
      <text x="125" y="44" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="6.5" text-anchor="middle">Control de Estudios</text>

      <!-- Laboratorios COMPROTIC -->
      <rect x="170" y="10" width="70" height="50" rx="3" fill="#042f2e" stroke="#10b981" stroke-width="1" />
      <text x="205" y="32" fill="#34d399" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" text-anchor="middle">COMPROTIC</text>
      <text x="205" y="44" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="6" text-anchor="middle">Laboratorios I+D</text>

      <!-- Central Hallway / Corredor -->
      <rect x="10" y="65" width="230" height="20" fill="#0f172a" />
      <text x="125" y="78" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">PASILLO CENTRAL NORTE</text>

      <!-- Aulas y Auditorio -->
      <rect x="10" y="90" width="110" height="45" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="65" y="115" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">AUDITORIO GENERAL</text>

      <rect x="125" y="90" width="115" height="45" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="182" y="115" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">AULAS 101 - 108</text>

      <!-- You are here Beacon -->
      <circle cx="125" cy="75" r="4" fill="#ef4444" />
      <circle cx="125" cy="75" r="8" stroke="#ef4444" stroke-width="1" opacity="0.6" />
      <text x="125" y="92" fill="#f87171" font-family="'Inter', sans-serif" font-size="6" font-weight="bold" text-anchor="middle">USTED ESTÁ AQUÍ</text>
    </g>

    <!-- Right: Legend & Department Search -->
    <g transform="translate(280, 60)">
      <rect width="102" height="145" rx="6" fill="#090e1a" stroke="#1e293b" />
      <text x="10" y="18" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8" font-weight="bold">BÚSQUEDA:</text>
      
      <rect x="8" y="24" width="86" height="18" rx="4" fill="#1e293b" />
      <text x="14" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7">🔍 DACE...</text>

      <text x="10" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold">LEYENDA P1:</text>

      <circle cx="14" cy="70" r="3" fill="#60a5fa" />
      <text x="22" y="73" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="6.5">DACE</text>

      <circle cx="14" cy="85" r="3" fill="#38bdf8" />
      <text x="22" y="88" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="6.5">Decanato</text>

      <circle cx="14" cy="100" r="3" fill="#34d399" />
      <text x="22" y="103" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="6.5">COMPROTIC</text>

      <circle cx="14" cy="115" r="3" fill="#cbd5e1" />
      <text x="22" y="118" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="6.5">Auditorio</text>

      <rect x="8" y="124" width="86" height="14" rx="3" fill="#042f2e" />
      <text x="51" y="134" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="6" text-anchor="middle">Ruta Óptima Activa</text>
    </g>

    <!-- Monitor Stand Base -->
    <polygon points="175,250 225,250 215,295 185,295" fill="#1e293b" stroke="#334155" />
    <rect x="150" y="295" width="100" height="14" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(175, 335)">
    <rect width="250" height="28" rx="14" fill="#090e1a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="125" y="18" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">ORIENTACIÓN ALL-IN-ONE • PANTALLA TÁCTIL</text>
  </g>
</svg>
