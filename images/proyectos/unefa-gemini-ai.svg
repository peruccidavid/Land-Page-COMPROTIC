<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="14" fill="#060913" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="300" cy="180" r="150" fill="url(#aiGlow)" />

  <!-- Web Browser Window Mockup -->
  <g transform="translate(50, 40)">
    <rect width="500" height="260" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect width="500" height="34" rx="14" fill="#090e1a" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="35" cy="17" r="4.5" fill="#eab308" />
    <circle cx="50" cy="17" r="4.5" fill="#22c55e" />
    
    <rect x="75" y="8" width="240" height="18" rx="5" fill="#1e293b" />
    <text x="88" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">https://comprotic.com.ve/ia</text>
    
    <!-- Gemini AI Studio Badge -->
    <rect x="330" y="8" width="155" height="18" rx="5" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="342" y="21" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">⚡ Gemini AI Studio Core</text>

    <!-- Web content with AI Widget -->
    <!-- Left: Portal Context text -->
    <g transform="translate(24, 55)">
      <rect width="180" height="20" rx="4" fill="#1e293b" />
      <text x="10" y="14" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">Portal UNEFA Oficial</text>
      <rect y="30" width="200" height="10" rx="2" fill="#1e293b" opacity="0.6" />
      <rect y="46" width="160" height="10" rx="2" fill="#1e293b" opacity="0.4" />
      <rect y="62" width="180" height="10" rx="2" fill="#1e293b" opacity="0.4" />
      <rect y="78" width="140" height="10" rx="2" fill="#1e293b" opacity="0.3" />
      
      <!-- Key Metric Pill -->
      <rect y="110" width="190" height="55" rx="8" fill="#042f2e" stroke="#10b981" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="12" y="130" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">Atención 24/7 Autónoma</text>
      <text x="12" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Descongestionamiento administrativo</text>
    </g>

    <!-- Right: Expanded Chat Widget -->
    <g transform="translate(245, 48)">
      <rect width="235" height="195" rx="10" fill="#090d16" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.2" />
      
      <!-- Chat Header inside web -->
      <rect width="235" height="30" rx="10" fill="#1e1b4b" />
      <circle cx="18" cy="15" r="5" fill="#a855f7" />
      <text x="30" y="19" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Asistente Inteligente UNEFA</text>
      <circle cx="215" cy="15" r="3" fill="#10b981" />

      <!-- Conversation bubbles -->
      <rect x="12" y="42" width="170" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="18" y="55" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">¿Cómo puedo solicitar una constancia</text>
      <text x="18" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">de estudios si soy egresado?</text>

      <rect x="25" y="82" width="198" height="68" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="32" y="96" fill="#c084fc" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Razonamiento Gemini:</text>
      <text x="32" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="7.5">Debes ingresar al módulo DACE,</text>
      <text x="32" y="119" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="7.5">consignar copia de cédula y arancel.</text>
      <text x="32" y="130" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="7.5">Tiempo de emisión: 3 días hábiles.</text>
      <text x="32" y="142" fill="#34d399" font-family="'Inter', sans-serif" font-size="7">✓ Validación de reglamento vigente</text>

      <!-- Input simulated -->
      <rect x="12" y="160" width="210" height="24" rx="6" fill="#1e293b" />
      <text x="20" y="176" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Escribe tu consulta académica...</text>
    </g>
  </g>

  <!-- Bottom Brand Footprint -->
  <g transform="translate(180, 320)">
    <rect width="240" height="30" rx="15" fill="#090e1a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="15" r="4" fill="#a855f7" />
    <text x="34" y="19" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">SISTEMA COGNITIVO ENLACE DACE</text>
  </g>
</svg>
